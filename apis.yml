name: Stanza Living
description: 'Stanza Living is one of India''s largest managed accommodation and co-living
  platforms, founded in 2017 by IIM-Ahmedabad alumni Anindya Dutta and Sandeep Dalmia
  and headquartered in Gurugram. It provides professionally managed, fully furnished,
  brokerage-free residences — student housing, co-living for working professionals,
  and managed apartments — across 24+ Indian cities, operating 450+ residences and
  more than 70,000 beds under the promise of "your second home in a new city." The
  company is backed by investors including Accel, Falcon Edge, Sequoia Capital and
  Matrix Partners. Stanza Living operates as a consumer web and mobile brand for
  discovering, booking and living in managed accommodation, and does not publish a
  public developer API surface.'
